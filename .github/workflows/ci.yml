name: Checks

# Pull requests (and manual runs): the same validation the deploy does, without deploying.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A rebase can leave the generated Worker validators behind the schemas; say so plainly, before the long steps.
      - name: Generated files are up to date
        run: npx tsx scripts/build-worker-validators.ts --check
      - run: npm run validate
      - run: npm run check
      - run: npm run build
