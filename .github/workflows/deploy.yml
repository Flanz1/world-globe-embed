name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.pending.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # If this push added images to content/incoming/, "Process maps" will convert them
      # and deploy afterwards, so skip here (the new map doesn't exist yet).
      - name: Check for unprocessed uploads
        id: pending
        run: |
          if find content/incoming -type f ! -name '.*' ! -iname 'readme*' | grep -q .; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Waiting for map processing::New images are in content/incoming/. The Process maps workflow will convert them and deploy."
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.pending.outputs.pending != 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.pending.outputs.pending != 'true'
        run: npm ci

      - name: Validate slots and maps
        if: steps.pending.outputs.pending != 'true'
        run: npm run validate

      - name: Typecheck, lint and test
        if: steps.pending.outputs.pending != 'true'
        run: npm run check

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: steps.pending.outputs.pending != 'true'

      - name: Build
        if: steps.pending.outputs.pending != 'true'
        env:
          # Relative base: the same build works on <user>.github.io/<repo>/ and on a custom domain.
          BASE_PATH: ./
          # The admin API (worker/) the admin page signs in and saves through; see docs/admin-access.md.
          VITE_ADMIN_API: ${{ vars.ADMIN_API_URL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.pending.outputs.pending != 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pending != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
