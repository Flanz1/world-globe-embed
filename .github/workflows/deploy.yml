name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.pending.outputs.pending }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # If this push added images to content/incoming/, "Process maps" will convert them
      # and deploy afterwards, so skip here (the new map doesn't exist yet).
      - name: Check for unprocessed uploads
        id: pending
        run: |
          if find content/incoming -type f ! -name '.*' ! -iname 'readme*' | grep -q .; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Waiting for map processing::New images are in content/incoming/. The Process maps workflow will convert them and deploy."
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.pending.outputs.pending != 'true'
        with:
          node-version: 22
          cache: npm

      - if: steps.pending.outputs.pending != 'true'
        run: npm ci

      - name: Validate slots and maps
        if: steps.pending.outputs.pending != 'true'
        run: npm run validate

      - name: Typecheck, lint and test
        if: steps.pending.outputs.pending != 'true'
        run: npm run check

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        if: steps.pending.outputs.pending != 'true'

      - name: Build
        if: steps.pending.outputs.pending != 'true'
        env:
          # Relative base: the same build works on <user>.github.io/<repo>/ and on a custom domain.
          BASE_PATH: ./
          # The admin API (worker/) the admin page signs in and saves through; see docs/admin-access.md.
          VITE_ADMIN_API: ${{ vars.ADMIN_API_URL }}
        run: npm run build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: steps.pending.outputs.pending != 'true'
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.pending != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
