name: Process maps

# Runs when someone drops an image into content/incoming/ (web UI upload or the admin page).
# Validates it, makes 1024/2048/4096 WebPs (plus 8192 for sources at least 8192 wide) + LQIP + metadata, deletes the original,
# commits the result back to main and then deploys the site.
#
# Two jobs, so the uploaded image is never decoded while a write token is around:
#  - process: npm ci + sharp on the upload, with a read-only token and no stored git credentials.
#    It hands the changed files over as an artifact.
#  - push: no npm, no image decoding. Mints the App token (contents: write only), applies the
#    files and pushes. A bug in an image decoder can't reach a token that can push to main.
on:
  push:
    branches: [main]
    paths: ["content/incoming/**"]
  workflow_dispatch:

# One run at a time; queued runs wait instead of being cancelled.
concurrency:
  group: process-maps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.collect.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Enough history for "git log" to find who uploaded each file.
          fetch-depth: 50
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Process uploaded images
        run: npm run process-maps

      - name: Collect the changed files
        id: collect
        run: |
          git add -A content/ public/maps/
          mkdir -p "$RUNNER_TEMP/processed"
          out="$RUNNER_TEMP/processed"
          git diff --cached --name-only --no-renames -z --diff-filter=AM > "$out/written.lst"
          git diff --cached --name-only --no-renames -z --diff-filter=D > "$out/deleted.lst"
          if [ ! -s "$out/written.lst" ] && [ ! -s "$out/deleted.lst" ]; then
            echo "Nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tar -cf "$out/written.tar" --null -T "$out/written.lst"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.collect.outputs.changed == 'true'
        with:
          name: processed-maps
          path: ${{ runner.temp }}/processed/
          retention-days: 1

  push:
    needs: process
    if: needs.process.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      # When the site's GitHub App is set up, the commit is pushed as the App (the one actor allowed
      # to push to main); its pushes start the Deploy workflow by themselves.
      app: ${{ steps.app.outputs.token != '' }}
    steps:
      - name: Token for the GitHub App
        id: app
        if: vars.APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ steps.app.outputs.token || github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: processed-maps
          path: ${{ runner.temp }}/processed

      - name: Commit processed maps
        id: commit
        run: |
          in="$RUNNER_TEMP/processed"
          # Only map output and the incoming folder may change; refuse anything else.
          ok() { case "$1" in content/maps/*|content/incoming/*|public/maps/*) case "$1" in *..*) return 1;; esac; return 0;; *) return 1;; esac; }
          while IFS= read -r -d '' f; do ok "$f" || { echo "::error::Unexpected path from processing: $f"; exit 1; }; done < "$in/written.lst"
          while IFS= read -r -d '' f; do ok "$f" || { echo "::error::Unexpected path from processing: $f"; exit 1; }; done < "$in/deleted.lst"
          if [ -s "$in/written.lst" ]; then tar -xf "$in/written.tar" --no-same-owner --no-overwrite-dir; fi
          while IFS= read -r -d '' f; do git rm -q --ignore-unmatch -- "$f"; done < "$in/deleted.lst"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A content/ public/maps/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          maps=$(git diff --cached --name-only -- content/maps | sed -E 's#content/maps/(.*)\.json#\1#' | paste -sd, - | sed 's/,/, /g')
          git commit -q -m "Process uploaded maps: ${maps} [bot]"
          # Someone may have pushed meanwhile: rebase onto the latest main and retry.
          for attempt in 1 2 3 4 5; do
            if git pull -q --rebase origin main && git push origin HEAD:main; then
              echo "committed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the processed maps after 5 attempts."
          exit 1

  # Pushes made with the workflow token don't trigger other workflows, so deploy from here.
  # (The App's pushes do, so there's nothing to do here then.)
  deploy:
    needs: push
    if: needs.push.outputs.committed == 'true' && needs.push.outputs.app != 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
    permissions:
      contents: read
      pages: write
      id-token: write
