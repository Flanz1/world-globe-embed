name: E2E

# Browser checks for the editor, admin and embed (scripts/e2e). Not a required check.
#  - Pull requests: only when code that can affect them changes (content/ and docs PRs skip it),
#    and only the suites scripts/e2e/select.mjs picks for the changed files.
#  - Nightly: the full suite on main.  By hand: all suites, or the ones you name.
#  - Called by Deploy before every deploy of main: the suites for what changed since the last deploy,
#    so main is never deployed while a fast-track merge's checks are still unknown.
on:
  pull_request:
    paths:
      - "src/**"
      - "admin/**"
      - "scripts/**"
      - "schema/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      suites:
        description: "Suites to run, space separated (empty = all)"
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: Commit to test
        type: string
        required: true
      base:
        description: Pick the suites for the changes since this commit (empty = all suites)
        type: string
        default: ""

permissions:
  contents: read

# Pull requests: a new push cancels the older run. Deploy's and nightly runs each get their own group
# (a cancelled pre-deploy run would block that deploy).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('e2e-{0}', github.ref) || format('e2e-run-{0}-{1}', github.run_id, inputs.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          fetch-depth: 0
      # select.mjs imports esbuild, so dependencies must be installed before it runs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pick suites
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.suites }}
          BASE: ${{ github.base_ref }}
          CALLED: ${{ inputs.ref && 'true' || 'false' }}
          SINCE: ${{ inputs.base }}
        run: |
          git fetch -q origin main
          SELECTED=no
          if [ "$CALLED" = true ]; then
            # From Deploy: the suites for what changed since the last deploy; no base = all suites.
            if [ -n "$SINCE" ]; then SUITES=$(node scripts/e2e/select.mjs "$SINCE"); SELECTED=yes; else SUITES=""; fi
          elif [ "$EVENT" = pull_request ]; then
            git fetch -q origin "$BASE"
            SUITES=$(node scripts/e2e/select.mjs "origin/$BASE"); SELECTED=yes
          else
            SUITES="$INPUT"
          fi
          echo "run=$([ "$SELECTED" = yes ] && [ -z "$SUITES" ] && echo no || echo yes)" >> "$GITHUB_OUTPUT"
          echo "suites=$SUITES" >> "$GITHUB_OUTPUT"
          echo "Suites: ${SUITES:-all}"
      - if: steps.pick.outputs.run == 'yes'
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - if: steps.pick.outputs.run == 'yes'
        env:
          SUITES: ${{ steps.pick.outputs.suites }}
        run: npm run e2e -- --jobs 2 $SUITES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.pick.outputs.run == 'yes'
        with:
          name: e2e-logs
          path: .e2e/
          # .e2e is a dot-folder; without this the action skips it and the logs/screenshots are lost.
          include-hidden-files: true
