# The admin API for the globe admin page. Deployed by .github/workflows/admin-api.yml.
# Secrets (set by that workflow from the repository's secrets): APP_PRIVATE_KEY, APP_CLIENT_SECRET, SESSION_KEY.
name = "world-globe-admin"
main = "src/index.ts"
compatibility_date = "2026-11-01"
# The API lives on its own address on Marko's domain. Cloudflare creates the DNS record and the
# certificate on the first deploy; the deploy token needs Zone → Workers Routes → Edit for garmeley.com.
workers_dev = false

[[routes]]
pattern = "admin-api.garmeley.com"
custom_domain = true

[vars]
REPO = "Flanz1/world-globe-embed"
BRANCH = "main"
OWNER_ID = "45669787"
ADMIN_URLS = "https://editor.garmeley.com/admin/"
# APP_ID and APP_CLIENT_ID come from the workflow (repository variables), so they aren't hard-coded here.

# People who signed in but aren't on the admin list yet (the Users tab's "Asked for access").
[[kv_namespaces]]
binding = "WAITING"
id = "c8f164f05c0e444a93563e0cd54c7ee6"

# Rate limit across all Worker instances (the code also counts per instance, so this is optional).
# One key per caller address and endpoint group; the Worker answers 429 over the limit.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 900, period = 60 }

# "X is editing this region": every admin tab holds a WebSocket to this one Durable Object (src/presence.ts).
# It keeps nothing in storage, so it never touches the KV limits; SQLite-backed because that's what the free plan offers.
[[durable_objects.bindings]]
name = "EDITING_ROOM"
class_name = "EditingRoom"

[[migrations]]
tag = "v1-editing-room"
new_sqlite_classes = ["EditingRoom"]
